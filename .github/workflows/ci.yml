name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  qa:
    name: Accessibility, checkout flow, Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview server
        run: |
          (cd site && npx astro preview --port 4321 --host 127.0.0.1 > /tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log; exit 1
      - run: npm run qa:a11y
      - run: npm run qa:checkout
      - run: npm run qa:tracking
      - run: npm run qa:admin
      - name: Consent banner + pixels (build with fake pixel IDs)
        run: |
          PUBLIC_META_PIXEL_ID=111 PUBLIC_GA4_ID=G-TEST PUBLIC_TIKTOK_PIXEL_ID=TT1 npm run build -w site
          npm run qa:pixels
          npm run build
      - run: npm run qa:lighthouse

  db:
    name: Migrations + RLS on clean Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/db-validate.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pp_test
