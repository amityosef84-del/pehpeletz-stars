# Netlify: build אחד שמוציא את דף הנחיתה ב-/ ואת האדמין ב-/admin.
# כל הסודות מוגדרים ב-Netlify → Site configuration → Environment variables (ראו .env.example).

[build]
  command = "npm run build"
  publish = "site/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# האדמין הוא SPA: כל נתיב תחת /admin מוגש מה-index שלו.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# ---- כותרות אבטחה לכל האתר ----
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

# CSP אחד לכל האתר והאדמין. אין סקריפטים inline (astro.config: assetsInlineLimit 0).
# 'unsafe-inline' רק לסגנונות (משתני CSS ב-style="..."). הדומיינים של Meta/Google/TikTok
# נחוצים לפיקסלים, שנטענים רק אחרי הסכמה בבאנר העוגיות.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://connect.facebook.net https://www.googletagmanager.com https://analytics.tiktok.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.facebook.com https://*.google-analytics.com https://*.googletagmanager.com https://*.tiktok.com; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.facebook.com https://connect.facebook.net https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://analytics.tiktok.com https://*.tiktokw.us https://*.tiktok.com; frame-src https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# נכסים עם hash בשם הקובץ: cache לשנה.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
